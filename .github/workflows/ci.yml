name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - name: Write .env.test from Supabase status
        run: |
          SB_ENV=$(supabase status -o env)
          echo "=== supabase status -o env (keys masked) ==="
          echo "$SB_ENV" | sed 's/=.*/=<masked>/'
          echo "============================================="
          SUPABASE_URL_VAL=$(echo "$SB_ENV" | grep -E '^(export )?API_URL=' | sed 's/.*API_URL=//' | tr -d '"'"'" )
          SUPABASE_KEY_VAL=$(echo "$SB_ENV" | grep -E '^(export )?ANON_KEY=' | sed 's/.*ANON_KEY=//' | tr -d '"'"'")
          SERVICE_ROLE_VAL=$(echo "$SB_ENV" | grep -E '^(export )?SERVICE_ROLE_KEY=' | sed 's/.*SERVICE_ROLE_KEY=//' | tr -d '"'"'")
          {
            echo "SUPABASE_URL=${SUPABASE_URL_VAL}"
            echo "SUPABASE_KEY=${SUPABASE_KEY_VAL}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_VAL}"
          } > .env.test
          echo "=== .env.test keys (URL only, keys masked) ==="
          grep SUPABASE_URL .env.test
          echo "SUPABASE_KEY and SUPABASE_SERVICE_ROLE_KEY are set: $(grep -c '^SUPABASE_KEY=.\|^SUPABASE_SERVICE_ROLE_KEY=.' .env.test) / 2"
      - run: npm run test:integration
